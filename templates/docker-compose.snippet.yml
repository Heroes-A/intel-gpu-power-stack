# =============================================================================
# B60 容器接入标准片段（docker compose）
#
# 用法：把 devices 那两行抄到你自己的 service 里，其余按需保留。
# 接入后自检： b60-check.sh <你的容器名>
#
# 三条硬规则：
#   1. 永远挂 /dev/b60/render —— 不要挂 /dev/dri。掩藏态下 /dev/dri 里根本没有 B60，
#      你挂到的是核显（card1/renderD128），会「能跑但很慢」。
#   2. 容器内叫什么无所谓。OpenVINO / VAAPI / oneAPI 只认「/dev/dri 下第一个 render 节点」，
#      所以映射成 /dev/dri/renderD128 最省事（很多镜像里写死了这个路径）。
#   3. 不需要 privileged、不需要 --network host、不需要任何 b60 相关环境变量。
#      挂载完成即永久直通真卡，空闲时链路自己进 L1（约 8W），有负载自己出来，零调度延迟。
# =============================================================================

services:
  my-gpu-app:
    image: my/app:latest
    container_name: my-gpu-app

    # ── 核心：两行接入 ────────────────────────────────────────────────────────
    devices:
      - /dev/b60/render:/dev/dri/renderD128      # 左边宿主机真卡，右边容器内路径（名字随意）
    # ─────────────────────────────────────────────────────────────────────────

    # 可选：某些镜像以非 root 用户跑，需要 render 组权限（宿主机 gid 用 getent group render 查）
    # group_add:
    #   - "993"

    # 可选：VAAPI 编码/解码常见需要（Intel 媒体栈）
    # environment:
    #   - LIBVA_DRIVER_NAME=iHD        # 或 iris；独显走 i915/xe 驱动栈时一般留空

    restart: unless-stopped

# =============================================================================
# 需要暴露给系统自带服务时（影视转码指定独显等）才需要租约：
#   b60-run --ttl 1800 <你的命令>
# 或者面板点「申请暴露租约」。容器不需要、也不应该触发这一步。
# =============================================================================
